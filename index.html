<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPC 00 (R2) — Modo Professor</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#271c3d;background:#f8f6fc}*{box-sizing:border-box}body{margin:0}header{background:#48206f;color:white;padding:12px 3vw;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}header strong{font-size:clamp(17px,2vw,25px)}header span{font-size:17px}.wrap{padding:20px 3vw 115px;max-width:1700px;margin:auto}.panel{background:white;border:3px solid #68418b;border-radius:18px;padding:clamp(20px,3vw,45px);min-height:65vh;box-shadow:0 8px 28px #2b145018}.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;min-height:75vh}.cover h1{font-size:clamp(35px,5vw,76px);line-height:1.1;margin:0;color:#4d237b}.cover h2{font-size:clamp(25px,3vw,44px);margin:0}.cover p{font-size:clamp(24px,3vw,38px);color:#8a3d20;font-weight:800}.tag{font-size:18px;color:#69418e;font-weight:bold;letter-spacing:.05em;text-transform:uppercase}.stem{white-space:pre-line;font-size:clamp(22px,2.15vw,36px);font-weight:650;line-height:1.42;white-space:pre-wrap;margin:20px 0 25px}.choices{display:grid;gap:12px}.choice{font-size:clamp(20px,1.8vw,29px);line-height:1.3;text-align:left;background:#f7f4fb;border:2px solid #ddd1ea;border-radius:12px;padding:15px 18px;cursor:pointer;color:#261b3d}.choice:hover{border-color:#7c40a8}.choice.selected{border:4px solid #5d2588;background:#eee1fa}.choice:disabled{cursor:default}.answer{font-size:clamp(23px,2.1vw,35px);font-weight:900;color:#3e176c}.explain{white-space:pre-line;font-size:clamp(22px,2vw,32px);line-height:1.5;white-space:pre-wrap;margin-top:22px}.toolbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #ddd;display:flex;justify-content:center;align-items:center;gap:10px;padding:11px;flex-wrap:wrap;box-shadow:0 -4px 18px #0001}button{font:700 18px Arial;border:0;border-radius:10px;padding:13px 20px;cursor:pointer;background:#552a80;color:white}button:disabled{opacity:.35;cursor:not-allowed}.green{background:#16853a}.red{background:#c52d35}.gray{background:#64616b}.light{height:25px;width:25px;border-radius:50%;background:#d0d0d0;display:inline-block;vertical-align:middle;box-shadow:inset 0 0 3px #777}.light.good{background:#17eb4d;box-shadow:0 0 25px 9px #16df4f}.light.bad{background:#ff3030;box-shadow:0 0 25px 9px #f33}.score{font-size:clamp(24px,2.7vw,42px);line-height:1.5}.hidden{display:none!important}.tiny{font-size:17px;color:#615a68}.status{font-size:19px;font-weight:bold}.scorebox{background:#f1eaf8;border-radius:14px;padding:22px;margin:20px 0}.cover button{font-size:24px;padding:20px 38px}@media(max-width:650px){.wrap{padding:12px 10px 170px}.panel{padding:18px;min-height:55vh}.toolbar{gap:5px;padding:8px}.toolbar button{font-size:15px;padding:10px 12px}.stem{white-space:pre-line;font-size:22px}.choice{font-size:20px}.explain{white-space:pre-line;font-size:22px}}
</style></head><body><header><strong>Curso de Contabilidade Professor Moreira</strong><span>Modo Professor · CPC 00 (R2)</span></header><main class="wrap"><section id="panel" class="panel"></section></main><nav class="toolbar" id="bar"><span id="lamp" class="light" title="Indicador de acerto ou erro"></span><button class="green" id="good" onclick="mark(true)">🟢 Acertou</button><button class="red" id="bad" onclick="mark(false)">🔴 Errou</button><button class="gray" onclick="prev()">← Voltar</button><button id="next" onclick="next()">Seguir →</button><button class="gray" onclick="restart()">↻ Reiniciar</button><span class="status" id="progress"></span></nav><script>
const Q=[{"n": 1, "stem": "Desreconhecimento é a retirada de parte ou da totalidade de ativo ou passivo reconhecido do balanço patrimonial da entidade. O desreconhecimento normalmente ocorre quando esse item não atende mais à definição de ativo ou passivo, que expirou, foi consumido, recebido, executado ou transferido. A máquina utilizada para a produção do principal produto de uma determinada entidade deve ser desreconhecida quando", "opts": ["perder todo o potencial de produzir benefícios econômicos para a entidade.", "estiver parcialmente depreciado.", "sofrer perda de valor recuperável.", "estiver sob controle da entidade"], "key": "A", "explanation": "Desreconhecer é retirar um ativo do balanço. Se a máquina perde definitivamente todo o potencial de produzir benefícios econômicos, deixa de atender à definição de ativo. Depreciação parcial e perda recuperável não implicam necessariamente baixa."}, {"n": 2, "stem": "Conforme a NBC TG – ESTRUTURA CONCEITUAL, uma Receita reflete aumento nos ativos, ou redução nos passivos, que resultam em aumentos no patrimônio líquido, exceto aqueles referentes a contribuições de detentores de direitos sobre o patrimônio.\n\nAvalie se são reconhecidos como Receita, nesse contexto, os seguintes itens:\n\nI. Ganho de aplicação financeira.\nII. Transferência de estoques a clientes.\nIII. Ganho na venda de imobilizado.\nIV. Entrada de recursos pela emissão/venda de debêntures.\nV. Entrada de recursos pela integralização do capital social.\nVI. Ganho na venda de ações em tesouraria.\n\nSão considerados receitas os itens", "opts": ["IV, V e VI.", "II, III e VI.", "I, III e IV.", "I, II e III."], "key": "D", "explanation": "I, II e III são receitas: ganho financeiro, receita decorrente da transferência de mercadorias ao cliente e ganho na venda de imobilizado. Debêntures geram obrigação; integralização de capital é aporte dos sócios; transações com ações em tesouraria são reconhecidas no patrimônio líquido."}, {"n": 3, "stem": "O conceito de Capital é adotado pela maioria das entidades na elaboração das Demonstrações Contábeis. A seleção do conceito apropriado de Capital pela entidade deve ser baseada nas necessidades dos seus usuários, principalmente, os preocupados com a manutenção de capital nominal investido ou com o poder de compra do capital investido. A manutenção do Capital em que o lucro é auferido somente se o montante dos ativos líquidos no final do período exceder o montante dos ativos líquidos no início do período, após excluir quaisquer distribuições para, e contribuições de, sócios durante o período, é a Manutenção do", "opts": ["Capital Físico.", "Capital Financeiro.", "Capital Social.", "Capital Integralizado."], "key": "B", "explanation": "Na manutenção do capital financeiro, há lucro quando os ativos líquidos finais excedem os iniciais, excluindo contribuições e distribuições aos sócios. Capital físico, diferentemente, refere-se à capacidade operacional."}, {"n": 4, "stem": "As demonstrações contábeis são normalmente elaboradas com base na suposição de que a entidade que reporta está em continuidade operacional. Desse modo, presume-se que a entidade não tem a intenção e nem a necessidade de", "opts": ["tornar-se internacional.", "modificar a sua atividade-fim.", "entrar em liquidação ou deixar de negociar.", "expandir os seus negócios para outras localidades."], "key": "C", "explanation": "A continuidade operacional pressupõe que a entidade seguirá operando no futuro previsível, sem intenção ou necessidade de liquidação ou encerramento das atividades."}, {"n": 5, "stem": "Uma entidade deseja reconhecer um ativo em seu balanço patrimonial. A sua mensuração envolve estimativas que estão sujeitas a incertezas. Nesse caso, a entidade", "opts": ["não deve reconhecer nem divulgar o ativo, uma vez que não há objetividade em sua mensuração.", "deve reconhecer o ativo sem mencionar a existência de estimativas, uma vez que estas foram elaboradas com zelo e são, portanto, confiáveis.", "não deve reconhecer o ativo, mas evidenciá-lo em notas explicativas, uma vez que não há espaço para incertezas nas demonstrações contábeis elaboradas.", "deve reconhecer o ativo e descrever e explicar as estimativas de forma clara e precisa, uma vez que o uso de estimativas razoáveis é parte essencial da elaboração de informações financeiras."], "key": "D", "explanation": "Estimativas razoáveis são parte essencial dos relatórios financeiros. Incerteza de mensuração não impede automaticamente o reconhecimento; as estimativas e suas incertezas relevantes devem ser explicadas claramente."}, {"n": 6, "stem": "Em 2023, uma entidade desreconheceu um ativo de seu balanço patrimonial. Assinale a opção que indica uma possível causa para o desreconhecimento.", "opts": ["A entidade decidiu utilizar um terreno para finalidade diferente.", "A entidade perdeu o controle de um imóvel, por meio de decisão judicial.", "A entidade renegociou o prazo de recebimento de seus clientes, que estavam em situação financeira difícil.", "A entidade constatou que as suas máquinas poderiam ser utilizadas por tempo maior do que a vida útil prevista."], "key": "B", "explanation": "A perda definitiva do controle de um imóvel por decisão judicial pode justificar seu desreconhecimento. Mudança de uso, renegociação de prazo e revisão de vida útil não significam, por si, perda do ativo."}, {"n": 7, "stem": "De acordo com o conceito de manutenção de capital financeiro, o lucro é auferido somente se o montante financeiro (ou dinheiro) dos ativos líquidos no final do período exceder o montante financeiro (ou dinheiro) dos ativos líquidos no início do período, após excluir", "opts": ["compra e venda de ativos fixos durante o período.", "distribuições para, e contribuições de, sócios durante o período.", "reconhecimento contábil de receitas e de despesas durante o período.", "recebimento de receitas e pagamentos de despesas durante o período."], "key": "B", "explanation": "Para apurar o lucro pela manutenção do capital financeiro, excluem-se as contribuições dos sócios e as distribuições feitas a eles. Aportes não são receitas e dividendos distribuídos não são despesas."}, {"n": 8, "stem": "Considerado um fato relevante divulgado por uma empresa de capital aberto, a perspectiva de alto potencial de entrada de benefícios econômicos futuros na aquisição de um novo ativo operacional resultou em um aumento (de R$ 4,50 para R$ 60,50 no valor nominal) de suas ações negociadas em Bolsa de Valores no país e no exterior. Dois meses depois, verificou-se que tal fato relevante era falso e que o acionista majoritário tinha conhecimento disso, o que resultou em prejuízo de bilhões de reais para entidade e foi tratado como crime contra o mercado financeiro. Na divulgação inicial do fato relevante, a característica qualitativa fundamental que deixou de ser observada pela entidade foi a", "opts": ["comparabilidade.", "prudência.", "verificabilidade.", "representação fidedigna."], "key": "D", "explanation": "Informação deliberadamente falsa viola a representação fidedigna, característica fundamental que exige representação completa, neutra e isenta de erros. Comparabilidade e verificabilidade são características de melhoria."}, {"n": 9, "stem": "Um investidor está analisando as demonstrações contábeis de uma sociedade empresária. O investidor tem disponível, para a sua análise, as demonstrações referentes a 31/12/2023, mas não as dos exercícios anteriores. Nesse caso, o investidor não poderá verificar a seguinte característica qualitativa:", "opts": ["relevância.", "tempestividade.", "comparabilidade.", "compreensibilidade."], "key": "C", "explanation": "Sem demonstrações anteriores, o investidor não consegue comparar a evolução da entidade ao longo do tempo. Comparabilidade permite identificar semelhanças e diferenças entre períodos ou entidades."}, {"n": 10, "stem": "Leia o fragmento a seguir: *Passivo é a obrigação _____ da entidade de transferir um recurso econômico como resultado de eventos _____*. Assinale a opção cujos itens completam corretamente as lacunas do fragmento acima.", "opts": ["futura / presente", "futura / passados", "presente / futuros", "presente / passados"], "key": "D", "explanation": "Passivo é obrigação PRESENTE da entidade de transferir recurso econômico como resultado de eventos PASSADOS. O pagamento pode ocorrer no futuro, mas a obrigação já existe."}, {"n": 11, "stem": "A NBC TG Estrutura Conceitual – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO indica o conceito financeiro e o conceito físico de capital. De acordo com a norma, a seleção do conceito apropriado de capital pela entidade deve ser baseada", "opts": ["na forma jurídica dos atos e fatos contábeis.", "na essência econômica dos atos e fatos contábeis.", "nas determinações das entidades reguladoras.", "nas necessidades dos usuários de suas demonstrações contábeis"], "key": "D", "explanation": "O conceito de capital deve ser escolhido conforme as necessidades dos usuários das demonstrações contábeis. Capital financeiro refere-se a ativos líquidos em termos monetários; capital físico à capacidade operacional."}, {"n": 12, "stem": "Um supermercado funciona na região sul do país. Em maio de 2024, devido às fortes chuvas, o supermercado perdeu todo o seu estoque. Nas demonstrações contábeis mensais, em 31/05/24, o supermercado optou por baixar todo o estoque, mesmo sem ter recebido um laudo oficial, de modo a tornar as demonstrações mais úteis aos tomadores de decisões. A informação apresenta a seguinte característica qualitativa:", "opts": ["neutralidade.", "materialidade.", "verificabilidade.", "tempestividade."], "key": "D", "explanation": "Tempestividade é disponibilizar informação em tempo hábil para influenciar decisões. A perda de estoques foi reconhecida oportunamente, sem esperar um laudo formal, desde que haja evidência adequada."}, {"n": 13, "stem": "De acordo com a NBC TG Estrutura Conceitual- ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as demonstrações contábeis consolidadas fornecem informações sobre os ativos, passivos, patrimônio líquido, receitas e despesas", "opts": ["apenas das controladas.", "apenas da controladora.", "da controladora e de suas controladas, como entidades independentes.", "da controladora e de suas controladas, como uma única entidade que reporta."], "key": "D", "explanation": "Demonstrações consolidadas apresentam controladora e controladas como uma única entidade que reporta. Operações e saldos intragrupo exigem ajustes e eliminações."}, {"n": 14, "stem": "De acordo com a NBC TG Estrutura Conceitual - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, patrimônio líquido é a participação nos ativos da entidade após", "opts": ["a dedução de seus passivos.", "a dedução de suas despesas.", "o acréscimo de suas receitas.", "o acréscimo de seus passivos."], "key": "A", "explanation": "Patrimônio líquido é a participação residual nos ativos depois da dedução de todos os passivos. Fórmula: PL = Ativo − Passivo."}, {"n": 15, "stem": "Segundo a NBC TG ESTRUTURA CONCEITUAL, para a representação dos relatórios financeiros ser fidedigna ela precisa ser", "opts": ["completa, neutra e isenta de erros.", "confiável, tempestiva e com erros mínimos.", "tempestiva, útil e comparável.", "consistente, completa e compreensível."], "key": "A", "explanation": "A representação fidedigna precisa ser COMPLETA, NEUTRA e ISENTA DE ERROS. Isenção de erros não significa que toda estimativa seja perfeitamente exata."}, {"n": 16, "stem": "De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as características qualitativas fundamentais são relevância e representação fidedigna, sendo que, para ser representação fidedigna, a representação deve ser completa, neutra e isenta de erros. Uma informação neutra pode", "opts": ["ser parcial.", "ser prudente.", "possuir inclinações.", "ser tendenciosa na seleção de informações financeiras."], "key": "B", "explanation": "A prudência é o exercício de cautela em julgamentos sob incerteza. Ela apoia a neutralidade e não autoriza subavaliar deliberadamente ativos ou superavaliar passivos."}, {"n": 17, "stem": "De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, para ajudar os usuários das demonstrações contábeis a identificar e avaliar mudanças e tendências, as demonstrações contábeis", "opts": ["são elaboradas com base na forma jurídica, em detrimento da essência das transações.", "restringem a utilização de estimativas a casos em que poderá haver perdas financeiras do usuário.", "incluem, apenas, informações que podem ser compreendidas, também, por usuários com pouco conhecimento das atividades comerciais e econômicas, sem auxílio de consultores.", "fornecem informações comparativas de, pelo menos, um período de relatório anterior."], "key": "D", "explanation": "Informações comparativas de pelo menos um período anterior ajudam os usuários a identificar mudanças e tendências. A essência econômica prevalece sobre uma descrição meramente formal."}, {"n": 18, "stem": "Uma sociedade empresária presta serviços de perícia a terceiros. Em junho de 2024, aconteceram os seguintes fatos: \n• Compra de material de escritório para pagamento em 60 dias: R$ 5.000,00; \n• Recebimento antecipado pelos serviços que serão prestados no segundo semestre: R$ 10.000,00; \n• Reconhecimento do salário de seus empregados, para pagamento em 5 de julho: R$ 12.000,00.\n\nEm junho de 2024, o passivo da sociedade empresária aumentou em", "opts": ["R$ 15.000,00.", "R$ 17.000,00.", "R$ 22.000,00.", "R$ 27.000,00."], "key": "D", "explanation": "Compra a prazo: fornecedores + R$ 5.000. Serviços recebidos antecipadamente: obrigação de prestar serviços + R$ 10.000. Salários apropriados e não pagos: salários a pagar + R$ 12.000. Total: 5.000 + 10.000 + 12.000 = R$ 27.000."}, {"n": 19, "stem": "De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, com relação às implicações das características qualitativas para a escolha da base de mensuração, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa.\n\n(   ) Utilizar consistentemente as mesmas bases de mensuração para os mesmos itens, seja de período a período, na entidade que reporta ou em um único período para diferentes entidades, prejudica a comparabilidade das demonstrações.\n\n(   ) A mudança na base de mensuração pode tornar as demonstrações contábeis menos compreensíveis. Contudo, a mudança pode ser justificada se outros fatores compensarem a redução na compreensibilidade, por exemplo, se a mudança resulta em informações mais relevantes.\n\n(   ) A verificação é melhorada utilizando-se bases de mensuração que resultam em avaliações que podem ser independentemente corroboradas diretamente, por exemplo, observando os preços, ou indiretamente, por exemplo, verificando dados de entrada de modelo.\n\nAs afirmativas são, respectivamente,", "opts": ["V – V – V.", "V – V – F.", "V – F – V.", "F – V – V."], "key": "D", "explanation": "1ª FALSA: uso consistente das bases de mensuração favorece, não prejudica, a comparabilidade. 2ª VERDADEIRA: mudança pode reduzir compreensibilidade, mas trazer maior relevância. 3ª VERDADEIRA: verificação direta ou indireta favorece verificabilidade. Sequência F–V–V."}, {"n": 20, "stem": "De acordo com a NBC TG ESTRUTURA CONCEITUAL (R2) – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO*, *ativo é um recurso econômico presente, controlado pela entidade como resultado de eventos passados. Um recurso econômico representa", "opts": ["um bem ou um direito que pertence à entidade.", "uma obrigação de transferir benefícios econômicos.", "um direito que tem o potencial de produzir benefícios econômicos.", "uma obrigação que resulta em aumento no patrimônio líquido, exceto quando referente a contribuições de detentores de direitos sobre o patrimônio."], "key": "C", "explanation": "Recurso econômico é um DIREITO que tem potencial de produzir benefícios econômicos. Ativo é recurso econômico presente controlado pela entidade como resultado de eventos passados; propriedade jurídica não é indispensável."}, {"n": 21, "stem": "Em 2024, uma empresa de varejo estimava inadimplência de 2% sobre o saldo de Clientes. Em 2025, buscando aumentar as vendas, a empresa reduziu as suas exigências para concessão de crédito aos clientes. Assim, uma análise criteriosa indicava que a inadimplência seria muito próxima de 5% nesse ano. No entanto, uma vez que os administradores da empresa são avaliados de acordo com o resultado operacional, eles escolheram continuar utilizando a estimativa anterior, de 2%. Ao avaliar se a informação contábil pode ser considerada representação fidedigna, é correto concluir que", "opts": ["pode ser, uma vez que é comparável.", "pode ser, uma vez que é tempestiva.", "não pode ser, uma vez que não é neutra.", "não pode ser, uma vez que não é verificável."], "key": "C", "explanation": "A estimativa fundamentada passou de 2% para 5%, mas gestores mantiveram 2% para favorecer o resultado. Essa escolha é tendenciosa e viola a neutralidade. Ex.: saldo de clientes R$ 1.000.000 → diferença de perdas esperadas de R$ 30.000."}, {"n": 22, "stem": "Em janeiro de 2026, uma entidade fabril assinou um contrato para a compra de uma máquina por R$ 50.000,00. O montante foi pago integralmente em fevereiro. A máquina foi recebida em março, quando foi instalada e disponibilizada para uso. No entanto, por decisão da entidade, a máquina começou a ser efetivamente utilizada em abril. No Balanço Patrimonial da entidade, a máquina deve ser reconhecida a partir de", "opts": ["janeiro.", "fevereiro.", "março.", "abril."], "key": "C", "explanation": "Janeiro: contrato. Fevereiro: pagamento antecipado. Março: máquina recebida, instalada e disponível para uso. Abril: uso efetivo. O reconhecimento da máquina no imobilizado ocorre em março. A depreciação também começa quando disponível para uso, não quando efetivamente utilizada."}, {"n": 23, "stem": "Em março de 2026, uma sociedade empresária publicou as suas demonstrações contábeis referentes a 31/12/2025. De acordo com a NBC TG ESTRUTURA CONCEITUAL – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as demonstrações contábeis são elaboradas para um período de tempo específico (período de relatório), para ajudar os usuários a identificar e avaliar mudanças e tendências e também", "opts": ["calculam os principais indicadores de análise contábil.", "apresentam projeções para, pelo menos, o exercício seguinte.", "reproduzem as normas contábeis relacionadas a cada ponto apresentado.", "fornecem informações comparativas de, pelo menos, um período de relatório anterior."], "key": "D", "explanation": "As demonstrações de 2025 fornecem informações comparativas de pelo menos um período anterior, permitindo identificar mudanças e tendências. Não há obrigação geral de projetar o próximo ano ou calcular todos os indicadores."}, {"n": 24, "stem": "Com base nos conceitos de ativos, passivos, receitas e despesas e dos critérios necessários para reconhecimento apresentados na NBC TG ESTRUTURA CONCEITUAL, assinale a afirmativa correta.", "opts": ["A receita deve ser reconhecida quando o cliente realiza o pedido para a realização de um determinado serviço, com contrapartida em Contas a Receber de Clientes.", "A distribuição de dividendos deve ser reconhecida como despesa financeira no resultado, em contrapartida ao passivo ou caixa.", "O aumento de capital gera o reconhecimento de receitas em contrapartida ao registro em caixa.", "O custo das mercadorias vendidas deve ser reconhecido quando ocorre a transferência de controle das mercadorias ao cliente, com a baixa dos estoques no ativo."], "key": "D", "explanation": "O custo das mercadorias vendidas é reconhecido com a transferência do controle das mercadorias ao cliente, com baixa do estoque. Ex.: venda R$ 15.000, custo R$ 9.000 → D CMV 9.000 / C Estoques 9.000; lucro bruto R$ 6.000. Pedido isolado não gera receita; dividendos e aporte de capital não são despesas ou receitas."}, {"n": 25, "stem": "Uma companhia S.A. realizou recentemente sua oferta pública inicial de ações (IPO) e passou a negociar seus papéis em Bolsa de Valores. Em uma reunião do conselho de administração, o diretor de relações com investidores destacou a importância do relatório financeiro para fins gerais, afirmando que ele deve atender às necessidades informacionais dos diversos usuários externos da companhia. Durante a reunião, foram apresentadas algumas afirmações sobre o objetivo do relatório financeiro para fins gerais. Considerando-se os preceitos da NBC TG ESTRUTURA CONCEITUAL, é correto afirmar que", "opts": ["o relatório financeiro para fins gerais destina-se a apresentar o valor de mercado da entidade que reporta.", "a administração da companhia depende das informações do relatório financeiro para fins gerais para basear suas decisões estratégicas.", "o relatório financeiro para fins gerais fornece todas as informações de que necessitam investidores, credores por empréstimos e administradores da companhia para a tomada de decisões.", "o objetivo do relatório financeiro para fins gerais é fornecer informações úteis a investidores, credores por empréstimos e outros credores, existentes e potenciais, para decisões sobre o fornecimento de recursos à entidade."], "key": "D", "explanation": "O relatório financeiro para fins gerais fornece informações úteis a investidores, credores por empréstimos e outros credores, atuais e potenciais, para decisões sobre fornecimento de recursos. Não pretende calcular o valor de mercado nem oferecer todas as informações possíveis."}, {"n": 26, "stem": "Relacione os conceitos de bases de mensuração do valor atual previstos na NBC TG ESTRUTURA CONCEITUAL para relatório financeiro, apresentados na primeira coluna, com seus respectivos significados, descritos na segunda coluna. \n1. Valor Justo \n2. Valor em uso \n3. Custo corrente \n4. Valor de cumprimento \n( ) É o preço que seria recebido pela venda de ativo ou que seria pago pela transferência de passivo em transação ordenada entre participantes do mercado na data de mensuração. \n( ) É o valor presente do caixa, ou de outros recursos econômicos, que a entidade espera ser obrigada a transferir para cumprir a obrigação. \n( ) É o valor presente dos fluxos de caixa, ou outros benefícios econômicos, que a entidade espera obter do uso de ativo e de sua alienação final. \n( ) É a contraprestação que seria paga pelo ativo equivalente na data de mensuração mais os custos de transação que seriam incorridos nessa data, ou a contraprestação que seria recebida pelo passivo equivalente na data de mensuração menos os custos de transação que seriam incorridos nessa data. \nA relação correta, na ordem apresentada, é:", "opts": ["4 – 2 – 3 – 1.", "1 – 4 – 2 – 3.", "2 – 3 – 1 – 4.", "3 – 4 – 2 – 1."], "key": "B", "explanation": "1ª definição = VALOR JUSTO (1): preço de saída em transação ordenada. 2ª = VALOR DE CUMPRIMENTO (4): valor presente para cumprir passivo. 3ª = VALOR EM USO (2): valor presente dos benefícios do ativo. 4ª = CUSTO CORRENTE (3): custo atual de item equivalente. Sequência 1–4–2–3."}, {"n": 27, "stem": "A NBC TG ESTRUTURA CONCEITUAL estabelece os conceitos dos elementos das demonstrações contábeis. Com base nessa norma, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa.\n\n(   ) Ativo é um recurso econômico presente de propriedade da entidade como resultado de eventos passados.\n\n(   ) Passivo é uma obrigação futura da entidade de transferir um recurso econômico como resultado de eventos passados.\n\n(   ) Receitas são aumentos nos ativos, ou reduções nos passivos, que resultam em aumento no patrimônio líquido, exceto aqueles referentes a contribuições de detentores de direitos sobre o patrimônio.\n\n(   ) Despesas são reduções nos ativos, ou aumentos nos passivos, que resultam em reduções no patrimônio líquido, exceto aqueles referentes a distribuições aos detentores de direitos sobre o patrimônio.\n\nAs afirmativas são, respectivamente,", "opts": ["F – F – V – V.", "F – V – F – V.", "V – F – V – F.", "V – V – F – F."], "key": "A", "explanation": "1ª FALSA: ativo exige CONTROLE, não necessariamente propriedade. 2ª FALSA: passivo é obrigação PRESENTE, não futura. 3ª VERDADEIRA: receitas aumentam o PL, exceto contribuições de proprietários. 4ª VERDADEIRA: despesas reduzem o PL, exceto distribuições aos proprietários. Sequência F–F–V–V."}, {"n": 28, "stem": "A NBC TG Estrutura Conceitual apresenta os elementos: \na. Despesa; \nb. Patrimônio Líquido; \nc. Receita.\n\nRelacione-os às definições: \nI. Aumentos nos ativos ou reduções nos passivos que resultam em aumento no patrimônio líquido. \nII. Reduções nos ativos ou aumentos nos passivos que resultam em reduções no patrimônio líquido. \nIII. Participação residual nos ativos após deduzir todos os passivos.\n\nOs elementos a, b e c correspondem, respectivamente, a quais definições?", "opts": ["II – III – I.", "I – III – II.", "II – I – III.", "I – II – III."], "key": "A", "explanation": "Despesa = definição II: redução de ativos ou aumento de passivos com redução do PL. Patrimônio líquido = definição III: participação residual nos ativos após deduzir passivos. Receita = definição I: aumento de ativos ou redução de passivos com aumento do PL. Sequência II–III–I."}], MODE='Professor', STUDENT=MODE==='Aluno', storage='moreira-cpc00-28-'+MODE;
let state={index:-1,phase:'question',answers:{},marks:{},checkpoints:{}};
try{let saved=JSON.parse(localStorage.getItem(storage));if(saved&&typeof saved.index==='number')state={...state,...saved}}catch(e){}
const el=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(storage,JSON.stringify(state))}catch(e){}}
function tally(end){let a=0,e=0,u=0;for(let i=0;i<end;i++){const q=Q[i];let m=state.marks[i];if(STUDENT){if(state.answers[i]===undefined){u++;continue}m=state.answers[i]===q.key;}if(m===true)a++;else if(m===false)e++;else u++;}return {a,e,u,p:Math.round(a/end*100)};}
function show(){let p=el('panel');el('bar').classList.toggle('hidden',state.index===-1);if(state.index===-1){p.innerHTML=`<div class="cover"><div class="tag">28 questões comentadas · Modo ${MODE}</div><h1>CPC 00 (R2)<br>Estrutura Conceitual para Relatório Financeiro</h1><h2>Curso de Contabilidade Professor Moreira</h2><p>Sua aprovação começa aqui</p><button onclick="start()">${state.index===-1?'Começar o quiz →':'Continuar'}</button><div class="tiny">Questão em uma tela · Resolução na tela seguinte</div></div>`;return}
let i=state.index,q=Q[i],scoreAt=STUDENT&&(state.phase==='score');
if(scoreAt){let t=tally(i+1);p.innerHTML=`<div class="tag">Escore de aprendizagem</div><h1>Resultado após ${i+1} questões</h1><div class="scorebox score">✅ Acertos: <b>${t.a}</b><br>❌ Erros: <b>${t.e}</b><br>◻️ Não respondidas: <b>${t.u}</b><br>📊 Aproveitamento: <b>${t.p}%</b></div><p class="score">${i===27?'Parabéns por concluir as 28 questões!':'Continue estudando. Sua aprovação começa aqui!'}</p>`}
else if(state.phase==='solution'){p.innerHTML=`<div class="tag">Questão ${i+1} de 28 · Tela de resolução</div><h2 class="answer">Gabarito: letra ${q.key}</h2><div class="explain">${escapeHTML(q.explanation)}</div>${STUDENT?`<p class="status">Sua resposta: ${state.answers[i]||'Não respondida'} ${state.answers[i]===undefined?'':state.answers[i]===q.key?'— ACERTOU!':'— ERROU!'}</p>`:''}`}
else{p.innerHTML=`<div class="tag">Questão ${i+1} de 28 · Tela da questão</div><div class="stem">${escapeHTML(q.stem)}</div><div class="choices">${q.opts.map((o,j)=>{let l='ABCD'[j];return `<button class="choice ${state.answers[i]===l?'selected':''}" onclick="choose('${l}')">${l}) ${escapeHTML(o)}</button>`}).join('')}</div><p class="tiny">${STUDENT?'Escolha uma alternativa. Ao seguir, você verá a resolução.':'Marque uma alternativa se desejar. A resolução só aparece na próxima tela.'}</p>`}
let m=state.marks[i];if(STUDENT&&state.answers[i]!==undefined)m=state.answers[i]===q.key;el('lamp').className='light'+(m===true?' good':m===false?' bad':'');el('good').classList.toggle('hidden',STUDENT);el('bad').classList.toggle('hidden',STUDENT);el('progress').textContent=`${i+1}/28 · ${scoreAt?'Escore':state.phase==='question'?'Questão':'Resolução'}`;el('next').textContent=scoreAt?(i===27?'Concluir ✓':'Próxima questão →'):state.phase==='question'?'Ver resolução →':(STUDENT&&[9,19,27].includes(i)?'Ver escore →':i===27?'Concluir ✓':'Próxima questão →');save();}

function prev(){if(state.index<0)return;if(state.phase==='score')state.phase='solution';else if(state.phase==='solution')state.phase='question';else if(state.index>0){state.index--;state.phase=STUDENT&&[9,19].includes(state.index)?'score':'solution'}else{state.index=-1}show()}
function finish(){const t=tally(28);el('panel').innerHTML=`<div class="cover"><h1>Quiz concluído!</h1><h2>Curso de Contabilidade Professor Moreira</h2><div class="score">${STUDENT?`Acertos: ${t.a} · Erros: ${t.e} · Aproveitamento: ${t.p}%`:'28 questões revisadas'}</div><p>Sua aprovação começa aqui</p><button onclick="restart()">Reiniciar o quiz</button></div>`;el('bar').classList.add('hidden');save()}
